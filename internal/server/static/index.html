<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>claudex</title>

    <link rel="icon" type="image/svg+xml" href="/static/icons/logo.svg">

    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#11111b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="claudex">

    <link rel="stylesheet" href="/static/css/inter.css">
    <link rel="stylesheet" href="/static/css/google-sans.css">
    <link rel="stylesheet" href="/static/css/jetbrains-mono.css">
    <link rel="stylesheet" href="/static/fontawesome/css/all.min.css">

    <script src="/static/js/lucide.min.js"></script>
    <script src="/static/js/tailwind.js"></script>
    <script src="/static/js/marked.umd.js"></script>
    <script src="/static/js/purify.min.js"></script>
    <script src="/static/js/highlight.min.js"></script>
    <script src="/static/js/mermaid.min.js"></script>
    <style>
      /* Catppuccin Mocha */
      :root, .dark {
        color-scheme: dark;
        --ctp-rosewater: #f5e0dc; --ctp-flamingo: #f2cdcd; --ctp-pink: #f5c2e7;
        --ctp-mauve: #cba6f7;     --ctp-red: #f38ba8;      --ctp-maroon: #eba0ac;
        --ctp-peach: #fab387;     --ctp-yellow: #f9e2af;   --ctp-green: #a6e3a1;
        --ctp-teal: #94e2d5;      --ctp-sky: #89dceb;      --ctp-sapphire: #74c7ec;
        --ctp-blue: #89b4fa;      --ctp-lavender: #b4befe; --ctp-text: #cdd6f4;
        --ctp-subtext1: #bac2de;  --ctp-subtext0: #a6adc8; --ctp-overlay2: #9399b2;
        --ctp-overlay1: #7f849c;  --ctp-overlay0: #6c7086; --ctp-surface2: #585b70;
        --ctp-surface1: #45475a;  --ctp-surface0: #313244; --ctp-base: #1e1e2e;
        --ctp-mantle: #181825;    --ctp-crust: #11111b;    --ctp-shade: #11111b;
      }

      * { scrollbar-width: none; }
      *::-webkit-scrollbar { display: none; }
      ::selection { background: color-mix(in oklab, var(--ctp-mauve) 35%, transparent); color: var(--ctp-text); }
      input[type=number] { appearance: textfield; }
      input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
      input:-webkit-autofill { -webkit-text-fill-color: var(--ctp-text); box-shadow: 0 0 0 100px var(--ctp-surface0) inset; caret-color: var(--ctp-text); }

      @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes pop-in { from { opacity: 0; transform: translateY(6px) scale(0.98); } to { opacity: 1; transform: none; } }
      @keyframes sheet-in { from { transform: translateY(100%); } to { transform: none; } }
      @keyframes toast-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
      @keyframes rise-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

      .markdown-body { color: var(--ctp-subtext0); line-height: 1.7; font-size: 15px; }
      .markdown-body > :first-child { margin-top: 0; }
      .markdown-body h1, .markdown-body h2, .markdown-body h3 { margin-top: 28px; margin-bottom: 14px; font-family: 'Google Sans', sans-serif; font-weight: 500; line-height: 1.25; padding-bottom: 0.3em; scroll-margin-top: 16px; }
      .markdown-body h1 { font-size: 2em; color: var(--ctp-lavender); border-bottom: 1px solid var(--ctp-surface0); }
      .markdown-body h2 { font-size: 1.5em; color: var(--ctp-mauve); border-bottom: 1px solid color-mix(in oklab, var(--ctp-surface0) 50%, transparent); }
      .markdown-body h3 { font-size: 1.25em; color: var(--ctp-blue); }
      .markdown-body h4 { font-size: 1em; color: var(--ctp-text); font-weight: 600; margin-block: 20px 8px; }
      .markdown-body h5, .markdown-body h6 { font-size: 0.875em; color: var(--ctp-text); font-weight: 600; }
      .markdown-body p { margin-bottom: 16px; }
      .markdown-body strong { color: var(--ctp-text); font-weight: 600; }
      .markdown-body a { color: var(--ctp-blue); text-decoration: none; }
      .markdown-body a:hover { text-decoration: underline; }
      .markdown-body ul, .markdown-body ol { padding-left: 1.75em; margin-bottom: 16px; }
      .markdown-body ul { list-style-type: disc; }
      .markdown-body ol { list-style-type: decimal; }
      .markdown-body li { margin-bottom: 0.25em; }
      .markdown-body li::marker { color: var(--ctp-overlay1); }
      .markdown-body li:has(> [role=checkbox], > p > [role=checkbox]) { list-style: none; }
      .markdown-body code { font-family: 'JetBrains Mono', monospace; color: var(--ctp-peach); background-color: var(--ctp-surface0); border-radius: 6px; padding: 0.15em 0.4em; font-size: 0.875em; }
      .markdown-body pre { position: relative; background-color: var(--ctp-base); border-radius: 1rem; padding: 1rem 1.25rem; margin-bottom: 16px; overflow: auto; }
      .markdown-body pre code { color: var(--ctp-text); background-color: transparent; padding: 0; font-size: 0.8125rem; line-height: 1.65; }

      .hljs { color: var(--ctp-text); background: transparent; }
      .hljs-keyword, .hljs-selector-tag, .hljs-doctag { color: var(--ctp-mauve); }
      .hljs-string, .hljs-regexp, .hljs-addition { color: var(--ctp-green); }
      .hljs-number, .hljs-literal, .hljs-meta { color: var(--ctp-peach); }
      .hljs-comment, .hljs-quote { color: var(--ctp-overlay2); font-style: italic; }
      .hljs-title, .hljs-section, .hljs-title.function_ { color: var(--ctp-blue); }
      .hljs-type, .hljs-title.class_, .hljs-class .hljs-title { color: var(--ctp-yellow); }
      .hljs-attr, .hljs-attribute, .hljs-property, .hljs-name, .hljs-selector-class, .hljs-selector-id { color: var(--ctp-blue); }
      .hljs-built_in, .hljs-deletion { color: var(--ctp-red); }
      .hljs-params, .hljs-variable, .hljs-template-variable { color: var(--ctp-maroon); }
      .hljs-symbol, .hljs-bullet, .hljs-link { color: var(--ctp-teal); }
      .hljs-operator, .hljs-punctuation { color: var(--ctp-sky); }
      .hljs-emphasis { font-style: italic; }
      .hljs-strong { font-weight: 600; }

      .markdown-body table { width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid color-mix(in oklab, var(--ctp-surface1) 50%, transparent); border-radius: 1rem; overflow: hidden; margin-bottom: 1.5rem; font-size: 14px; }
      .markdown-body [data-table] > table { margin-bottom: 0; }
      .markdown-body thead { background-color: color-mix(in oklab, var(--ctp-mauve) 10%, transparent); }
      .markdown-body tr:nth-child(2n) { background-color: color-mix(in oklab, var(--ctp-surface0) 30%, transparent); }
      .markdown-body th { color: var(--ctp-mauve); font-weight: 600; border-bottom: 1px solid color-mix(in oklab, var(--ctp-surface1) 50%, transparent); border-right: 1px solid color-mix(in oklab, var(--ctp-surface0) 50%, transparent); padding: 10px 16px; text-align: left; }
      .markdown-body td { border-bottom: 1px solid color-mix(in oklab, var(--ctp-surface0) 30%, transparent); border-right: 1px solid color-mix(in oklab, var(--ctp-surface0) 30%, transparent); padding: 10px 16px; text-align: left; }
      .markdown-body th:last-child, .markdown-body td:last-child { border-right: none; }
      .markdown-body tr:last-child td { border-bottom: none; }
      .markdown-body blockquote { border-left: 0.25em solid color-mix(in oklab, var(--ctp-surface1) 60%, transparent); padding: 0 1em; margin-bottom: 16px; }
      .markdown-body hr { border: none; border-top: 1px solid var(--ctp-surface0); margin-block: 1.5em; }
      .markdown-body img { max-width: 100%; border-radius: 1rem; }
      .markdown-body.chat-reply { font-size: 15px; line-height: 1.7; }
      .markdown-body.chat-tile { font-size: 14px; line-height: 1.6; }
      .chat-reply > :last-child, .chat-tile > :last-child, .user-md > :last-child { margin-bottom: 0 !important; }
      .chat-reply, .chat-tile, .user-md { overflow-wrap: break-word; }
      .chat-reply :not(pre) > code, .chat-tile :not(pre) > code, .user-md :not(pre) > code { overflow-wrap: anywhere; }
      .markdown-body.user-md { color: var(--ctp-text) !important; font-size: 14px; line-height: 1.625; }
      .user-md p, .user-md ul, .user-md ol, .user-md pre { margin-bottom: 10px; }
      .user-md code, .user-md pre { background-color: var(--ctp-surface1) !important; }
      .user-md pre { padding: 0.75rem 1rem !important; }
      .chat-tile pre { background-color: var(--ctp-surface0); }

      .mermaid {
        background-color: var(--ctp-base);
        padding: 1rem;
        border-radius: 1rem;
        margin-block: 1.5rem;
        overflow-x: auto;
      }
      .mermaid > svg { margin-inline: auto; }
      .mermaid:not([data-processed]) { color: transparent; min-height: 8rem; }
      .mermaid .grid .tick line { stroke: var(--ctp-surface0) !important; stroke-width: 0.5px !important; opacity: 0.5 !important; }
      .mermaid .grid .tick text { fill: var(--ctp-subtext0) !important; }
      .mermaid .grid path { stroke: var(--ctp-surface0) !important; stroke-width: 0.5px !important; }
      .mermaid .section { stroke: none !important; }
      .mermaid .section0, .mermaid .section2 { fill: var(--ctp-mantle) !important; }
      .mermaid .section1, .mermaid .section3 { fill: var(--ctp-base) !important; }
      .mermaid .today { stroke: var(--ctp-red) !important; stroke-width: 2px !important; }
      .mermaid .taskText { fill: var(--ctp-base) !important; font-size: 0.75em !important; }
      .mermaid .taskTextOutsideRight, .mermaid .taskTextOutsideLeft { fill: var(--ctp-text) !important; }
      .mermaid .sectionTitle { fill: var(--ctp-mauve) !important; }
      .mermaid .titleText { fill: var(--ctp-mauve) !important; }

      .callout {
        padding: 1rem;
        border-radius: 1rem;
        margin-bottom: 1rem;
        display: flex;
        gap: 0.75rem;
        align-items: flex-start;
        background-color: color-mix(in oklab, var(--ctp-surface0) 20%, transparent);
      }
      .callout-icon { display: inline-flex; align-items: center; flex-shrink: 0; line-height: 1; padding-top: 0.3em; }
      .callout-icon svg { width: 1em; height: 1em; }
      .callout-content { flex: 1; min-width: 0; }
      .callout-content p { margin: 0 !important; }
      .callout.tip     { background-color: color-mix(in oklab, var(--ctp-green) 10%, transparent); }
      .callout.tip     .callout-icon { color: var(--ctp-green); }
      .callout.info    { background-color: color-mix(in oklab, var(--ctp-blue) 10%, transparent); }
      .callout.info    .callout-icon { color: var(--ctp-blue); }
      .callout.danger  { background-color: color-mix(in oklab, var(--ctp-red) 10%, transparent); }
      .callout.danger  .callout-icon { color: var(--ctp-red); }
      .callout.warning { background-color: color-mix(in oklab, var(--ctp-peach) 10%, transparent); }
      .callout.warning .callout-icon { color: var(--ctp-peach); }
      .callout.note    { background-color: color-mix(in oklab, var(--ctp-mauve) 10%, transparent); }
      .callout.note    .callout-icon { color: var(--ctp-mauve); }
    </style>
    <style type="text/tailwindcss">
      @theme inline {
        --color-rosewater: var(--ctp-rosewater); --color-flamingo: var(--ctp-flamingo);
        --color-pink: var(--ctp-pink);           --color-mauve: var(--ctp-mauve);
        --color-red: var(--ctp-red);             --color-maroon: var(--ctp-maroon);
        --color-peach: var(--ctp-peach);         --color-yellow: var(--ctp-yellow);
        --color-green: var(--ctp-green);         --color-teal: var(--ctp-teal);
        --color-sky: var(--ctp-sky);             --color-sapphire: var(--ctp-sapphire);
        --color-blue: var(--ctp-blue);           --color-lavender: var(--ctp-lavender);
        --color-text: var(--ctp-text);           --color-subtext1: var(--ctp-subtext1);
        --color-subtext0: var(--ctp-subtext0);   --color-overlay2: var(--ctp-overlay2);
        --color-overlay1: var(--ctp-overlay1);   --color-overlay0: var(--ctp-overlay0);
        --color-surface2: var(--ctp-surface2);   --color-surface1: var(--ctp-surface1);
        --color-surface0: var(--ctp-surface0);   --color-base: var(--ctp-base);
        --color-mantle: var(--ctp-mantle);       --color-crust: var(--ctp-crust);
        --color-shade: var(--ctp-shade);
      }
      @theme {
        --font-sans: 'Inter', sans-serif;
        --font-display: 'Google Sans', sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
        --font-mono--font-feature-settings: "calt" 0;
        --breakpoint-3xl: 120rem;
      }
      @layer base {
        button:not(:disabled), [role="button"], [role="option"], a[href], summary { cursor: pointer; }
      }
    </style>
</head>
<body class="bg-crust text-subtext0 h-dvh overflow-hidden flex flex-col font-sans antialiased">
    <header class="shrink-0 flex items-center gap-3 px-4 pt-4 sm:px-6 lg:px-8 lg:pt-5">
        <a href="#/" data-action="app-home" aria-label="claudex" data-tip="Dashboard (refreshes)" class="flex items-center gap-2.5 font-display text-xl font-medium text-text">
            <img src="/static/icons/logo.svg" alt="" class="size-10 sm:size-11">
            <span class="max-sm:hidden">claudex</span>
        </a>
        <nav id="nav-sessions" aria-label="Active sessions" class="ml-3 flex min-w-0 items-center max-lg:hidden"></nav>
        <span id="nav-status" class="text-overlay1"></span>
        <nav id="nav-links" class="ml-auto flex gap-1 rounded-full bg-mantle p-1"></nav>
    </header>

    <main id="view" class="flex-1 min-h-0 px-4 py-4 sm:px-6 lg:px-8 lg:py-5"></main>

    <div id="layer-root"></div>

    <script src="/static/ui.js"></script>
    <script src="/static/app.js"></script>
    <script src="/static/api.js"></script>
    <script src="/static/live.js"></script>
    <script src="/static/views/dashboard.js"></script>
    <script src="/static/views/new-session.js"></script>
    <script src="/static/views/chat.js"></script>
    <script src="/static/views/shell.js"></script>
    <script src="/static/views/project.js"></script>
    <script src="/static/views/settings.js"></script>
    <script>
        app.start();
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>
</html>
